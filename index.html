<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お母さん、お誕生日おめでとう｜ほしいものクイズ</title>
<meta name="description" content="2択・3択に答えるだけ。お母さんが本当に欲しいものを、息子がこっそり探すクイズです。">
<meta name="theme-color" content="#fff7f0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<main class="wrap">

  <!-- ① はじめの画面 -->
  <section class="screen" data-screen="intro">
    <div class="hero">
      <div class="hero-emoji">🎂</div>
      <h1>お母さん、<br>60歳のお誕生日おめでとう</h1>
      <p class="lead">
        「お菓子でいいよ」と言ってくれるけれど、<br>
        せっかくの節目なので、ちゃんと選びたいのです。
      </p>
      <p class="lead">
        2つか3つの中から、ピンとくるほうを押していくだけ。<br>
        10問くらいで終わります。最後に、その結果を<br>
        息子に送るボタンが出てきます。
      </p>
      <button type="button" id="start-button" class="primary">はじめる</button>
      <button type="button" id="resume-button" class="secondary" hidden>前回のつづきから</button>
      <p class="fine">※ 答えは、送るボタンを押すまで誰にも届きません。</p>
    </div>
  </section>

  <!-- ② 質問画面 -->
  <section class="screen" data-screen="quiz" hidden>
    <div class="progress">
      <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
      <p class="progress-text" id="progress-text"></p>
    </div>
    <h2 class="question" id="question-text"></h2>
    <p class="question-sub" id="question-sub" hidden></p>
    <div class="choices" id="choices"></div>
    <button type="button" id="back-button" class="ghost">← ひとつ前にもどる</button>
  </section>

  <!-- ③ 結果画面 -->
  <section class="screen" data-screen="result" hidden>
    <h2 class="result-title">たぶん、これが近いです 🎁</h2>
    <p class="result-lead">この中で、いちばんピンとくるものを押してください。</p>
    <div class="result-list" id="result-list"></div>
    <button type="button" id="more-button" class="secondary">うーん、ほかの候補も見る</button>
    <button type="button" id="retry-button" class="ghost">最初からやりなおす</button>
  </section>

  <!-- ④ 送る画面 -->
  <section class="screen" data-screen="send" hidden>
    <h2 class="result-title">息子に知らせましょう 📮</h2>
    <div class="picked">
      <div class="picked-emoji" id="picked-emoji"></div>
      <div>
        <div class="picked-name" id="picked-name"></div>
        <div class="picked-budget" id="picked-budget"></div>
      </div>
    </div>

    <label class="field">
      <span class="field-label">ひとこと（書かなくても大丈夫です）</span>
      <textarea id="message-input" rows="3" maxlength="400"
        placeholder="例：色は紺か茶色がいいな。ありがとう。"></textarea>
    </label>

    <div class="send-buttons">
      <button type="button" id="copy-button" class="primary">文章をコピーする</button>
      <a id="share-line" class="primary primary--line" href="#" target="_blank" rel="noopener">LINEで送る</a>
      <a id="share-mail" class="secondary" href="#">メールで送る</a>
    </div>
    <p class="copy-status" id="copy-status"></p>
    <textarea id="fallback-text" class="fallback" rows="6" readonly hidden></textarea>

    <button type="button" id="send-back-button" class="ghost">← 結果にもどる</button>
  </section>

  <!-- ⑤ 息子が結果を受け取る画面（リンクを開いたとき） -->
  <section class="screen" data-screen="received" hidden>
    <h2 class="result-title">お母さんの答えが届きました 💌</h2>

    <div class="picked picked--big">
      <div class="picked-emoji" id="received-emoji"></div>
      <div>
        <div class="picked-name" id="received-name"></div>
        <div class="picked-budget" id="received-budget"></div>
        <div class="picked-note" id="received-note"></div>
      </div>
    </div>

    <div class="message-card" id="received-message" hidden>
      <div class="message-label">お母さんからのひとこと</div>
      <p id="received-message-text"></p>
    </div>

    <div id="received-others-wrap">
      <h3 class="sub-title">次点だった候補</h3>
      <ul class="plain-list" id="received-others"></ul>
    </div>

    <h3 class="sub-title">好みのキーワード</h3>
    <div class="tags" id="received-tags"></div>

    <h3 class="sub-title">答えの全部</h3>
    <ul class="qa-list" id="received-answers"></ul>
  </section>

</main>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
